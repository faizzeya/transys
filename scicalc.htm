<title>Quadrant Graphing Calculator</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Martian+Mono:wght@400;500&display=swap">
<style>
/* Layout: an instrument bench — keyed calculator with an LCD readout on the left, plotting sheet on the right; stacked with tabs on phones. */
:root{
  --bg:#E8ECF0; --panel:#F7F9FA; --panel-2:#EDF1F4; --ink:#16202A; --muted:#5A6774; --line:#D2D9E0;
  --key:#FFFFFF; --key-ink:#16202A; --key-edge:#C9D1D9; --key-fn:#E3E9EE; --key-op:#D3DDE7;
  --shift:#C26A1C; --shift-ink:#FFFFFF; --accent:#1E5A96; --accent-ink:#FFFFFF; --err:#B3261E;
  --lcd:#D5DECF; --lcd-ink:#18251B; --lcd-dim:#6E7F6C;
  --plot:#FCFDFD; --grid-minor:#EEF1F4; --grid-major:#DCE2E8; --axis:#6A7682;
  --f1:#1E5A96; --f2:#C0402B; --f3:#2B8653; --f4:#8649BC; --f5:#C26A1C; --f6:#148686;
  --ui:"IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --lcdfont:"Martian Mono", "IBM Plex Mono", ui-monospace, Menlo, monospace;
  --mono:"IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0E1216; --panel:#161B21; --panel-2:#1C222A; --ink:#E3E8ED; --muted:#8D99A5; --line:#29313A;
  --key:#232A33; --key-ink:#E3E8ED; --key-edge:#323B46; --key-fn:#1C232B; --key-op:#28323D;
  --shift:#E6954A; --shift-ink:#1A1007; --accent:#5E9BD6; --accent-ink:#08131E; --err:#F2867B;
  --lcd:#131A15; --lcd-ink:#CBE2C1; --lcd-dim:#6F8569;
  --plot:#11161B; --grid-minor:#182027; --grid-major:#253039; --axis:#7C8995;
  --f1:#6EA8E0; --f2:#EE7A63; --f3:#5BC189; --f4:#B48AE8; --f5:#EFA45C; --f6:#4CC3C3;
  color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#0E1216; --panel:#161B21; --panel-2:#1C222A; --ink:#E3E8ED; --muted:#8D99A5; --line:#29313A;
  --key:#232A33; --key-ink:#E3E8ED; --key-edge:#323B46; --key-fn:#1C232B; --key-op:#28323D;
  --shift:#E6954A; --shift-ink:#1A1007; --accent:#5E9BD6; --accent-ink:#08131E; --err:#F2867B;
  --lcd:#131A15; --lcd-ink:#CBE2C1; --lcd-dim:#6F8569;
  --plot:#11161B; --grid-minor:#182027; --grid-major:#253039; --axis:#7C8995;
  --f1:#6EA8E0; --f2:#EE7A63; --f3:#5BC189; --f4:#B48AE8; --f5:#EFA45C; --f6:#4CC3C3;
  color-scheme:dark }

*{box-sizing:border-box}
body{background:var(--bg); color:var(--ink); font-family:var(--ui); font-size:14px; line-height:1.45}
button,input{font:inherit; color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px}

.app{max-width:1360px; margin:0 auto; padding-block:18px 32px;
  padding-left:max(16px, env(safe-area-inset-left, 0px)); padding-right:max(16px, env(safe-area-inset-right, 0px));
  display:flex; flex-direction:column; gap:16px}
.top{display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap}
.brand{display:flex; align-items:center; gap:10px; min-width:0}
.brand svg{flex:none; color:var(--accent)}
.brand h1{margin:0; font-family:var(--lcdfont); font-weight:500; font-size:19px; letter-spacing:-.01em}
.brand p{margin:0; color:var(--muted); font-size:13px}
.tabs{display:none; background:var(--panel-2); border:1px solid var(--line); border-radius:10px; padding:3px; gap:3px}
.tabs button{border:0; background:transparent; padding:7px 16px; border-radius:7px; font-weight:500; color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--panel); color:var(--ink); box-shadow:0 1px 2px rgb(0 0 0 / .12)}

.layout{display:grid; grid-template-columns:minmax(320px, 392px) minmax(0, 1fr); gap:18px; align-items:start}
.card{background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:14px; min-width:0}
h2{margin:0; font-size:12px; font-weight:600; text-transform:uppercase; letter-spacing:.08em; color:var(--muted)}
h3{margin:0; font-size:12px; font-weight:600; color:var(--muted)}

/* calculator */
.calc{display:flex; flex-direction:column; gap:12px}
.lcd{background:var(--lcd); color:var(--lcd-ink); border-radius:9px; padding:10px 12px 12px;
  box-shadow:inset 0 2px 5px rgb(0 0 0 / .18); display:flex; flex-direction:column; gap:4px}
.ann{display:flex; gap:12px; font-family:var(--mono); font-size:10.5px; letter-spacing:.08em; font-weight:500}
.ann span{opacity:.18; transition:opacity .12s}
.ann span.on{opacity:1}
.ann .sp{flex:1}
#expr{width:100%; background:transparent; border:0; text-align:right; font-family:var(--lcdfont); font-size:15px;
  color:var(--lcd-ink); padding:4px 0; outline:none}
#expr::placeholder{color:var(--lcd-dim)}
.result{font-family:var(--lcdfont); font-size:26px; text-align:right; min-height:38px; overflow-wrap:anywhere; line-height:1.3}
.result.preview{color:var(--lcd-dim); font-size:20px}
.result.error{color:var(--err); font-size:14px; font-family:var(--ui); font-weight:500; padding-top:6px}

.keypad{display:grid; grid-template-columns:repeat(5, minmax(0,1fr)); gap:6px}
.k{display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; min-height:50px; padding:4px 2px;
  background:var(--key); color:var(--key-ink); border:1px solid var(--key-edge); border-bottom-width:3px; border-radius:8px;
  font-weight:500; font-size:15px; user-select:none; -webkit-user-select:none; touch-action:manipulation}
.k:active{transform:translateY(1px); border-bottom-width:2px}
.k .sec{font-size:10px; line-height:1; min-height:11px; color:var(--shift); font-weight:500; padding:1px 3px; border-radius:3px; white-space:nowrap}
.k .main{line-height:1.1; white-space:nowrap}
.k.fn{background:var(--key-fn)}
.k.op{background:var(--key-op); font-size:19px}
.k.shift{background:var(--shift); color:var(--shift-ink); border-color:var(--shift)}
.k.shift.on{box-shadow:0 0 0 2px var(--panel), 0 0 0 4px var(--shift)}
.k.toggle.on{box-shadow:inset 0 0 0 2px var(--accent)}
.k.eq{background:var(--accent); color:var(--accent-ink); border-color:var(--accent); font-size:21px}
.k.clr .main{color:var(--err)}
.keypad.shifted .k .sec:not(:empty){background:var(--shift); color:var(--shift-ink)}
.keypad.shifted .k:not(.shift) .main{opacity:.45}

.hist-head{display:flex; align-items:center; justify-content:space-between}
.link{border:0; background:none; color:var(--accent); font-size:13px; padding:2px 4px}
#hist{list-style:none; margin:8px 0 0; padding:0; max-height:210px; overflow:auto; display:flex; flex-direction:column}
#hist li{display:flex; flex-direction:column; align-items:flex-end; gap:1px; padding:7px 4px; border-top:1px solid var(--line)}
#hist li:first-child{border-top:0}
#hist button{border:0; background:none; padding:0; text-align:right; max-width:100%; overflow-wrap:anywhere}
#hist .he{color:var(--muted); font-family:var(--mono); font-size:12.5px}
#hist .hr{font-family:var(--lcdfont); font-size:14px}
#hist button:hover{color:var(--accent)}
.empty{color:var(--muted); font-size:13px; padding:8px 0}
.chips{display:flex; flex-wrap:wrap; gap:6px; margin-top:8px}
.chip{border:1px solid var(--line); background:var(--panel-2); border-radius:999px; padding:4px 10px; font-family:var(--mono); font-size:12px}
.chip:hover{border-color:var(--accent)}

/* graph */
.graph{display:flex; flex-direction:column; gap:12px}
.gbar{display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap}
.readout{font-family:var(--mono); font-size:12.5px; color:var(--muted); display:flex; flex-wrap:wrap; gap:4px 14px; min-height:20px; min-width:0}
.readout b{font-weight:500}
.gbtns{display:flex; gap:6px}
.gb{border:1px solid var(--line); background:var(--panel-2); border-radius:8px; height:34px; min-width:36px; padding:0 10px; font-weight:500}
.gb:hover{border-color:var(--accent)}
.plotwrap{position:relative; height:clamp(320px, 60vh, 640px); border:1px solid var(--line); border-radius:10px; overflow:hidden; background:var(--plot)}
#plot{display:block; width:100%; height:100%; touch-action:none; cursor:crosshair}
#plot.dragging{cursor:grabbing}

.lower{display:grid; grid-template-columns:minmax(0,1.1fr) minmax(0,1fr); gap:16px}
.sec-head{display:flex; align-items:baseline; justify-content:space-between; gap:8px; margin-bottom:8px}
.hint{color:var(--muted); font-size:12px}
#fnList{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:6px}
.fn{display:grid; grid-template-columns:auto auto minmax(0,1fr) auto; align-items:center; gap:8px; padding:6px 8px;
  border:1px solid var(--line); border-radius:9px; background:var(--panel)}
.fn.active{border-color:var(--c); background:var(--panel-2)}
.sw{width:20px; height:20px; border-radius:50%; border:2.5px solid var(--c); background:var(--c); padding:0}
.sw.off{background:transparent}
.fname{font-family:var(--mono); font-size:13px; color:var(--c); white-space:nowrap}
.fn input{min-width:0; width:100%; border:0; background:transparent; font-family:var(--mono); font-size:14px; padding:6px 2px; outline:none}
.fdel{border:0; background:none; color:var(--muted); font-size:18px; width:28px; height:28px; border-radius:6px}
.fdel:hover{color:var(--err); background:var(--panel-2)}
.ferr{grid-column:3 / 5; color:var(--err); font-size:12px}
#addFn{margin-top:8px; border:1px dashed var(--line); background:none; border-radius:9px; padding:8px; width:100%; color:var(--accent); font-weight:500}
#addFn:disabled{color:var(--muted); cursor:default}

.analysis{border:1px solid var(--line); border-radius:10px; padding:12px; display:flex; flex-direction:column; gap:10px; background:var(--panel-2); min-width:0}
.analysis .sec-head{margin:0}
.arow{display:flex; flex-direction:column; gap:3px}
.mono{font-family:var(--mono); font-size:13px; overflow-wrap:anywhere}
.out{font-family:var(--mono); font-size:13px; color:var(--ink)}
.fieldrow{display:flex; align-items:center; gap:6px; flex-wrap:wrap; font-size:13px; color:var(--muted)}
.fieldrow input[type=text]{width:78px; border:1px solid var(--line); background:var(--panel); border-radius:6px; padding:4px 7px; font-family:var(--mono); font-size:13px}
.check{display:flex; align-items:center; gap:7px; font-size:13px; color:var(--muted); cursor:pointer}
.check input{accent-color:var(--accent)}
.pts{display:grid; grid-template-columns:1fr 1fr; gap:10px}
.pts ul{list-style:none; margin:4px 0 0; padding:0; font-family:var(--mono); font-size:12.5px; font-variant-numeric:tabular-nums; display:flex; flex-direction:column; gap:2px}
.pts li span{color:var(--muted)}
.tag{display:inline-block; font-family:var(--ui); font-size:10.5px; letter-spacing:.04em; text-transform:uppercase; padding:0 5px; border-radius:4px; border:1px solid var(--line); color:var(--muted); margin-left:4px}

@media (max-width: 920px){
  .tabs{display:flex}
  .layout{grid-template-columns:minmax(0,1fr)}
  .layout[data-view="calc"] #graph{display:none}
  .layout[data-view="graph"] #calc{display:none}
}
@media (max-width: 680px){ .lower{grid-template-columns:minmax(0,1fr)} .brand p{display:none} }
@media (max-width: 380px){ .k{min-height:46px; font-size:14px} .k .sec{font-size:9px} }
@media (prefers-reduced-motion: reduce){ *{transition:none!important} }
</style>

<div class="app">
  <header class="top">
    <div class="brand">
      <svg width="30" height="30" viewBox="0 0 30 30" aria-hidden="true"><path d="M3 15h24M15 3v24" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" opacity=".45" fill="none"/><path d="M4 23c4-1 6-14 11-8s7 3 11-9" stroke="currentColor" stroke-width="2.4" fill="none" stroke-linecap="round"/></svg>
      <div><h1>Quadrant</h1><p>Scientific calculator and function plotter</p></div>
    </div>
    <div class="tabs" role="tablist" aria-label="View">

  <main class="layout" id="layout" data-view="calc">
    <section class="card calc" id="calc" aria-label="Calculator">
      <div class="lcd">
        <div class="ann" aria-live="polite"><span id="a-shift">2ND</span><span id="a-hyp">HYP</span><span id="a-mem">M</span><span class="sp"></span><span id="a-deg">DEG</span><span id="a-rad" class="on">RAD</span></div>
        <input id="expr" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Type or tap an expression" aria-label="Expression">

            <label class="check"><input type="checkbox" id="an-plotd"> Plot f′(x) as a dashed line</label></div>
          <div class="arow"><div class="fieldrow"><label for="an-x">Value at x =</label><input type="text" id="an-x" value="1"></div><div class="out" id="an-xout"></div></div>
          <div class="arow"><div class="fieldrow"><span>∫ from</span><input type="text" id="an-a" value="0" aria-label="Lower limit"><span>to</span><input type="text" id="an-b" value="π" aria-label="Upper limit"></div><div class="out" id="an-int"></div>
            <label class="check"><input type="checkbox" id="an-shade" checked> Shade the area</label></div>

    </section>
  </main>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/mathjs/11.8.0/math.min.js"></script>
<script>
(() => {
const $ = s => document.querySelector(s);
const store = {
  get(k, d){ try { const v = localStorage.getItem('quadrant.' + k); return v ? JSON.parse(v) : d; } catch { return d; } },
  set(k, v){ try { localStorage.setItem('quadrant.' + k, JSON.stringify(v)); } catch {} }
};

/* ---------- math setup ---------- */
const G = math.create(math.all);   // graphing: always radians
const C = math.create(math.all);   // calculator: respects DEG/RAD
let deg = store.get('deg', false);
for (const m of [G, C]) m.import({
  nCr: (n, k) => m.combinations(n, k),
  nPr: (n, k) => m.permutations(n, k),
  rand: () => Math.random()
}, { override: true });
(() => {
  const rep = {};
  for (const n of ['sin','cos','tan','sec','csc','cot']) {
    const fn = C[n];
    const f = x => fn(deg ? x * Math.PI / 180 : x);
    rep[n] = C.typed(n, { 'number': f, 'Complex': x => fn(x), 'Array | Matrix': x => C.map(x, f) });
  }
  for (const n of ['asin','acos','atan','asec','acsc','acot']) {
    const fn = C[n];
    const f = x => { const r = fn(x); return deg && typeof r === 'number' ? r * 180 / Math.PI : r; };
    rep[n] = C.typed(n, { 'number': f, 'Complex': x => fn(x), 'Array | Matrix': x => C.map(x, f) });
  }
  C.import(rep, { override: true });
})();

// Calculator-style notation -> math.js syntax.
function fixLog(s){
  const re = /(?<![A-Za-z_])log\(/g; let out = '', last = 0, m;
  while ((m = re.exec(s))) {
    const start = m.index + 4; let depth = 1, comma = false;
    for (let j = start; j < s.length && depth > 0; j++) {
      const c = s[j];
      if (c === '(' || c === '[') depth++;
      else if (c === ')' || c === ']') depth--;
      else if (c === ',' && depth === 1) comma = true;
    }
    out += s.slice(last, m.index) + (comma ? 'log(' : 'log10(');
    last = start;
  }
  return out + s.slice(last);
}
function prep(s){
  s = s.replace(/×|·/g, '*').replace(/÷/g, '/').replace(/[−–]/g, '-')
       .replace(/π/g, 'pi').replace(/√/g, 'sqrt').replace(/∛/g, 'cbrt')
       .replace(/²/g, '^2').replace(/³/g, '^3').replace(/⁻¹/g, '^(-1)');
  s = s.replace(/(\d+(?:\.\d+)?)%(?![\w(])/g, '($1/100)');
  s = s.replace(/(\d)e(?!\d)/g, '$1*e');
  s = fixLog(s);
  s = s.replace(/(?<![A-Za-z_])ln\(/g, 'log(');
  return s;
}
const SUP = { '0':'⁰','1':'¹','2':'²','3':'³','4':'⁴','5':'⁵','6':'⁶','7':'⁷','8':'⁸','9':'⁹','-':'⁻','+':'' };
function pretty(str){
  return str.replace(/(-?\d+(?:\.\d+)?)e([+-]\d+)/g, (_, a, b) => `${a}×10${[...b].map(c => SUP[c]).join('')}`)
            .replace(/(^|[\s(\[,])-/g, '$1−');
}
function fmtRaw(r, precision = 12){
  if (r === undefined || r === null) return '';
  if (typeof r === 'function') return 'function defined';
  if (r && r.isResultSet) r = r.entries[r.entries.length - 1];
  if (typeof r === 'number' && !isFinite(r)) return isNaN(r) ? 'Undefined' : (r > 0 ? 'Infinity' : '-Infinity');
  return C.format(r, { precision, lowerExp: -9, upperExp: 15 });
}
function friendly(msg){
  let m;
  if ((m = /Undefined symbol (\S+)/.exec(msg))) return `Unknown name “${m[1]}”`;
  if ((m = /Undefined function (\S+)/.exec(msg))) return `Unknown function “${m[1]}”`;
  if (/Parenthesis \) expected/.test(msg)) return 'Missing closing parenthesis';
  if (/Unexpected end of expression/.test(msg)) return 'The expression is incomplete';
  return msg.replace(/\(char \d+\)/, '').trim();
}

/* ---------- calculator ---------- */
const exprEl = $('#expr'), resEl = $('#result');
const scope = { Ans: 0, M: 0 };
let shift = false, hyp = false, justEval = false, mem = null, caret = 0;
const fine = matchMedia('(pointer: fine)').matches;

const KEYS = [
  { m:['2nd','@shift'], c:'shift', id:'k-shift' },
  { m:['RAD','@angle'], c:'fn', id:'k-angle' },
  { m:['hyp','@hyp'], c:'fn toggle', id:'k-hyp' },
  { m:['M+','@mplus'], s:['M−','@mminus'], c:'fn' },
  { m:['MR','@mr'], s:['MC','@mc'], c:'fn' },

  { m:['sin','sin('], s:['sin⁻¹','asin('], h:['sinh','sinh('], hs:['sinh⁻¹','asinh('], c:'fn' },
  { m:['cos','cos('], s:['cos⁻¹','acos('], h:['cosh','cosh('], hs:['cosh⁻¹','acosh('], c:'fn' },
  { m:['tan','tan('], s:['tan⁻¹','atan('], h:['tanh','tanh('], hs:['tanh⁻¹','atanh('], c:'fn' },
  { m:['ln','ln('], s:['eˣ','e^('], c:'fn' },
  { m:['log','log('], s:['10ˣ','10^('], c:'fn' },

  { m:['x²','²'], s:['x³','³'], c:'fn' },
  { m:['xʸ','^'], s:['ʸ√x','nthRoot('], c:'fn' },
  { m:['√','√('], s:['∛','∛('], c:'fn' },
  { m:['x⁻¹','⁻¹'], s:['|x|','abs('], c:'fn' },
  { m:['n!','!'], s:['nCr','nCr('], c:'fn' },

  { m:['π','π'], s:['rand','rand()'], c:'fn' },
  { m:['e','e'], s:['nPr','nPr('], c:'fn' },
  { m:['(','('], s:['⌊x⌋','floor('], c:'fn' },
  { m:[')',')'], s:['⌈x⌉','ceil('], c:'fn' },
  { m:['%','%'], s:['mod',' mod '], c:'fn' },

  { m:['7','7'] }, { m:['8','8'] }, { m:['9','9'] },

      view.kx = pinch.kx * f; view.ky = pinch.ky * f;
      view.cx = pinch.wx - (mid.x - W / 2) / view.kx; view.cy = pinch.wy - (H / 2 - mid.y) / view.ky;
      analyzeSoon();
    }
  }
  hover = { sx: p.x }; updateReadout(); redraw();
});
const up = e => { pts.delete(e.pointerId); if (pts.size < 2) pinch = null; if (!pts.size) canvas.classList.remove('dragging'); };
canvas.addEventListener('pointerup', up); canvas.addEventListener('pointercancel', up);
canvas.addEventListener('pointerleave', e => { if (e.pointerType === 'mouse') { hover = null; updateReadout(); redraw(); } });
canvas.addEventListener('wheel', e => {
  e.preventDefault(); const p = pos(e); const f = Math.exp(-e.deltaY * (e.deltaMode ? 0.05 : 0.0015));
  if (e.shiftKey) zoomAt(p.x, p.y, f, 1); else if (e.altKey) zoomAt(p.x, p.y, 1, f); else zoomAt(p.x, p.y, f);
}, { passive: false });
$('#zIn').onclick = () => zoomAt(W / 2, H / 2, 1.5);
$('#zOut').onclick = () => zoomAt(W / 2, H / 2, 1 / 1.5);
$('#resetV').onclick = resetView;
$('#fitY').onclick = () => {
  const ys = [];
  for (const f of fns) { if (!f.vis || !f.code) continue; for (let sx = 0; sx <= W; sx += 3) { const y = ev(f.code, IX(sx)); if (isFinite(y)) ys.push(y); } }
  if (!ys.length) return;
  ys.sort((a, b) => a - b);
  const lo = ys[Math.floor(ys.length * .02)], hi = ys[Math.ceil(ys.length * .98) - 1];
  const span = Math.max(hi - lo, 1e-9);
  view.cy = (lo + hi) / 2; view.ky = H * .84 / span; redraw(); analyzeSoon();
};

function updateReadout(){
  const el = $('#readout');
  if (!hover) { el.textContent = 'Drag to pan · scroll or pinch to zoom · Shift+scroll zooms x only'; return; }
  const x = IX(hover.sx);
  const step = niceStep(90 / view.kx) / 100;
  el.innerHTML = '';
  const xs = document.createElement('span'); xs.innerHTML = `<b>x</b> = ${fmtN(Math.round(x / step) * step, 6)}`; el.append(xs);
  fns.forEach((f, i) => {
    if (!f.vis || !f.code) return;
    const s = document.createElement('span'); s.style.color = `var(--f${f.ci + 1})`;
    s.textContent = `f${SUB[i]} = ${fmtN(ev(f.code, x), 6)}`; el.append(s);
  });
}

/* ---------- analysis ---------- */
function evalNum(str){ try { return toReal(G.evaluate(prep(String(str).trim()))); } catch { return NaN; } }
function bisectRoots(code, a, b, N = 700){
  const res = [], tol = (b - a) * 1e-7;
  let xp = a, yp = ev(code, a);
  for (let i = 1; i <= N && res.length < 12; i++) {
    const x = a + (b - a) * i / N, y = ev(code, x);
    if (isFinite(yp) && isFinite(y)) {
      let r = null;
      if (y === 0) r = x;
      else if (yp * y < 0) {
        let lo = xp, hi = x, flo = yp;
        for (let k = 0; k < 70; k++) { const m = (lo + hi) / 2, fm = ev(code, m); if (!isFinite(fm)) break; if (flo * fm <= 0) hi = m; else { lo = m; flo = fm; } }
        const c = (lo + hi) / 2, fc = ev(code, c);
        if (isFinite(fc) && Math.abs(fc) <= 1e-6 * Math.max(1, Math.abs(yp), Math.abs(y))) r = c;
      }
      if (r !== null && !(res.length && Math.abs(r - res[res.length - 1]) < tol)) res.push(r);
    }
    xp = x; yp = y;
  }
  return res;
}
function simpson(code, a, b){
  if (a === b) return 0;
  let sign = 1; if (a > b) { [a, b] = [b, a]; sign = -1; }
  const n = 2000, h = (b - a) / n; let s = ev(code, a) + ev(code, b);
  for (let i = 1; i < n; i++) s += (i % 2 ? 4 : 2) * ev(code, a + i * h);
  return isFinite(s) ? sign * s * h / 3 : NaN;
}
function analyze(){
  const f = activeFn();
  const nm = $('#an-name');
  an = { roots: [], ext: [], a: evalNum($('#an-a').value), b: evalNum($('#an-b').value) };
  const R = $('#an-roots'), E = $('#an-ext');
  R.innerHTML = ''; E.innerHTML = '';
  if (!f || !f.code) {
    nm.textContent = f ? nameOf(f) : '';
    $('#an-deriv').textContent = f && f.error ? f.error : 'Enter a function to analyze it.';
    $('#an-xout').textContent = ''; $('#an-int').textContent = '';
    redraw(); return;
  }
  nm.textContent = nameOf(f) + '(x)'; nm.style.color = `var(--f${f.ci + 1})`;
  $('#an-deriv').textContent = f.dstr || '—';
  const xv = evalNum($('#an-x').value);
  $('#an-xout').textContent = isFinite(xv)
    ? `${nameOf(f)}(${fmtN(xv, 6)}) = ${fmtN(ev(f.code, xv))}` + (f.dcode ? `   ·   slope = ${fmtN(ev(f.dcode, xv))}` : '')
    : 'Enter a number or expression for x.';
  if (isFinite(an.a) && isFinite(an.b)) {
    const I = simpson(f.code, an.a, an.b);
    $('#an-int').textContent = isFinite(I) ? `∫ = ${fmtN(I, 9)}` : 'The function is undefined somewhere in this range.';
  } else $('#an-int').textContent = 'Enter numeric limits, such as 0 and π.';
  if (W) {
    const x0 = IX(0), x1 = IX(W);
    an.roots = bisectRoots(f.code, x0, x1);
    if (f.dcode) {
      const h = (x1 - x0) * 1e-4;
      for (const r of bisectRoots(f.dcode, x0, x1)) {
        const y = ev(f.code, r), yl = ev(f.code, r - h), yr = ev(f.code, r + h);
        if (!isFinite(y)) continue;
        if (y >= yl && y >= yr) an.ext.push({ x: r, y, kind: 'max' });
        else if (y <= yl && y <= yr) an.ext.push({ x: r, y, kind: 'min' });
      }
    }
  }
  const li = html => { const el = document.createElement('li'); el.innerHTML = html; return el; };
  if (!an.roots.length) R.append(li('<span>None visible</span>'));
  an.roots.slice(0, 8).forEach(r => R.append(li(`x = ${fmtN(r, 7)}`)));
  if (an.roots.length > 8) R.append(li(`<span>+${an.roots.length - 8} more</span>`));
  if (!an.ext.length) E.append(li(`<span>${f.dcode ? 'None visible' : 'Needs a derivative'}</span>`));
  an.ext.slice(0, 8).forEach(p => E.append(li(`(${fmtN(p.x, 5)}, ${fmtN(p.y, 5)})<span class="tag">${p.kind}</span>`)));
  redraw();
}
['#an-x', '#an-a', '#an-b'].forEach(s => $(s).addEventListener('input', analyze));
$('#an-plotd').addEventListener('change', redraw);
$('#an-shade').addEventListener('change', redraw);

$('#tab-calc').onclick = () => setView('calc');
$('#tab-graph').onclick = () => setView('graph');

const retheme = () => { readColors(); draw(); };

if (document.fonts) document.fonts.ready.then(draw);

readColors(); labelKeys(); renderHist(); renderFns();
if (!hist.length) { exprEl.value = '√(2)×π + sin(π/6)'; caret = exprEl.value.length; preview(); }
else showResult('0', 'preview');
analyze();
})();
